<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <title>Page not found — S.S AI LABS</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <meta name="theme-color" content="#0a0a0a" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: radial-gradient(120% 90% at 80% 0%, #2a1240 0%, #0a0a0a 60%);
        color: #f5f5f5;
        font-family: "Space Grotesk", "Plus Jakarta Sans", system-ui, -apple-system,
          "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        text-align: center;
      }
      .eyebrow {
        margin: 0 0 12px;
        font-size: 12px;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: #c084fc;
      }
      h1 { margin: 0 0 12px; font-size: clamp(40px, 12vw, 88px); line-height: 1; letter-spacing: -0.02em; }
      p { margin: 0 auto 32px; max-width: 46ch; color: rgba(245, 245, 245, 0.72); line-height: 1.6; }
      .actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
      a {
        display: inline-block;
        padding: 14px 26px;
        border-radius: 999px;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        text-decoration: none;
        transition: transform 0.2s ease, background 0.2s ease;
      }
      a:hover { transform: translateY(-2px); }
      .primary { background: #c084fc; color: #0a0a0a; }
      .secondary { border: 1px solid rgba(192, 132, 252, 0.4); color: #f5f5f5; }
      @media (prefers-reduced-motion: reduce) { a { transition: none; } a:hover { transform: none; } }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Error 404</p>
      <h1>Page not found</h1>
      <p>
        This page does not exist at S.S AI LABS. Head back to the homepage to explore our
        website development, custom software, AI automation and digital growth services.
      </p>
      <div class="actions">
        <a class="primary" href="/">Back to homepage</a>
        <a class="secondary" href="/#start-project">Start a project</a>
      </div>
    </main>
  </body>
</html>
