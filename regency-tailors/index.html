<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Regency Tailor — Bespoke Showroom & Tailoring Suite</title>
    <meta name="description" content="Bespoke tailoring management system for Regency Tailor showroom." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!--
      The brand faces are loaded without blocking the first paint.

      A plain <link rel="stylesheet"> to Google Fonts is render-blocking: the
      browser will not paint until it resolves. Measured on the production
      build, that held the showroom at a blank page for 12.6 seconds when the
      request could not complete — identical at 1x, 2x and 4x CPU throttle,
      because the wait is the network, not the machine. A counter that opens
      this every morning cannot depend on a third party being reachable.

      `media="print"` makes the browser fetch the sheet at low priority without
      blocking; the onload handler promotes it to `all` the moment it arrives.
      Nothing about the design changes — the same two families, applied the
      same way. Until they land, the stack in index.css falls back to Segoe UI
      on Windows, and `display=swap` swaps them in without a flash of nothing.
      The <noscript> copy keeps the fonts for a browser with JS disabled.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
      crossorigin="anonymous"
      media="print"
      onload="this.media='all'"
    >
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" crossorigin="anonymous">
    </noscript>
  </head>
  <body class="bg-[#F7F3EA] text-[#071426] antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
