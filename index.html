<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Tab and home-screen branding. Nothing was declared here before, so the
         browser fell back to requesting /favicon.ico, which the SPA catch-all
         in server.ts answers with index.html — the tab kept whatever generic
         icon the host had. These icons are cut from the mark in
         src/assets/traders-planet-logo.jpg; the wordmark under it is
         illegible below about 64px, so the tile reuses the mark alone on the
         logo's own background. Files live in public/, so Vite copies them to
         the site root unhashed and /favicon.ico resolves for real. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0C091E" />

    <!-- Poppins is the app's typeface. Only the four weights the UI actually
         uses are fetched; display=swap keeps first paint immediate and falls
         back to the stack in index.css if the request is blocked. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
    />
    <title>The Traders Planet</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
