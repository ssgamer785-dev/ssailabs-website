<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale/user-scalable keep the shell at 1:1 on mobile. iOS Safari
         ignores user-scalable for accessibility, which is why the gesture
         handlers in src/lib/app-zoom.ts exist rather than relying on this. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no"
    />

    <!-- Restores a saved dark theme before the first paint. Without this the
         page paints light from index.css, React mounts, and the theme flips a
         frame later — a white flash on every reload for anyone using dark.
         Inline and synchronous on purpose: a deferred module would be too late.
         The key matches THEME_STORAGE_KEY in src/lib/theme.tsx. -->
    <script>
      try {
        if (localStorage.getItem('tp-theme') === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (e) {}
    </script>

    <!-- Tab and home-screen branding. Nothing was declared here before, so the
         browser fell back to requesting /favicon.ico, which the SPA catch-all
         in server.ts answers with index.html — the tab kept whatever generic
         icon the host had. These icons are cut from the mark in
         src/assets/traders-planet-logo.jpg; the wordmark under it is
         illegible below about 64px, so the tile reuses the mark alone on the
         logo's own background. Files live in public/, so Vite copies them to
         the site root unhashed and /favicon.ico resolves for real. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0C091E" />

    <!-- Poppins is the app's typeface and is self-hosted: the @font-face in
         src/index.css points at src/assets/fonts/Poppins-Regular.ttf, so the
         font ships with the bundle instead of being fetched from a third
         party that a network can block. -->
    <title>The Traders Planet</title>

    <!-- The startup splash paints from this file, before any of the app's own
         code or stylesheet has downloaded: the artwork used to be discovered
         only after the whole bundle had run, so phones showed an empty
         gradient and a bar for seconds first (TP-058). The React splash
         adopts this one (same picture, the bar continues where it is) and
         removes it once its own copy has painted. -->
    <style>
      #tp-boot {
        position: absolute; top: 0; left: 0; right: 0; z-index: 1000;
        min-height: 100vh; min-height: 100dvh;
        display: flex; align-items: center; justify-content: center;
        background: #EEF1F7;
      }
      .tp-boot-frame {
        position: relative; width: 390px; height: 844px; overflow: hidden;
        border-radius: 36px; background: #0C091E; container-type: size;
        box-shadow: 0 20px 50px rgba(15, 23, 42, .11), 0 2px 6px rgba(15, 23, 42, .05);
      }
      @media (max-width: 480px) {
        #tp-boot { background: #0C091E; }
        .tp-boot-frame { width: 100vw; height: 100vh; height: 100dvh; border-radius: 0; box-shadow: none; }
      }
      /* Nothing but the brand colour until the whole picture can be drawn:
         no partial image, no bar over an empty frame. */
      .tp-boot-frame img {
        position: absolute; inset: 0; width: 100%; height: 100%;
        object-fit: cover; object-position: center; display: block; opacity: 0;
      }
      #tp-boot.art-ready .tp-boot-frame img { opacity: 1; }
      #tp-boot:not(.art-ready) .splash-stage { display: none; }
      /* The React splash under an adopted boot splash is already on screen. */
      .splash-shell.adopted:not(.is-leaving) { animation: none; }
      .splash-shell.art-pending .splash-stage { display: none; }

      /* --- Startup splash ------------------------------------------------------
         The splash is a single piece of artwork that already contains the logo, the
         wordmark, the trader, the bull, the chart, the loading bar and its label.
         Nothing here redraws any of that; these rules only size the picture, drive
         the loading bar it already paints, and run the screen's own enter and exit. */

      /* It owns its transitions rather than taking the generic screen-enter above:
         that rule fills `both`, which would pin the splash at opacity 1 and swallow
         the exit entirely. container-type gives .splash-stage a box to measure. */
      .splash-shell {
        animation: splash-in 380ms cubic-bezier(0.32, 0.72, 0, 1) both;
        container-type: size;
      }

      .splash-shell.is-leaving {
        animation: splash-out 460ms cubic-bezier(0.4, 0, 0.2, 1) both;
      }

      @keyframes splash-in {
        from { opacity: 0; }
        to   { opacity: 1; }
      }

      /* Lifts away rather than cutting: the scale is small enough to read as depth
         rather than as movement, and the app fades up behind it. */
      @keyframes splash-out {
        from { opacity: 1; transform: scale(1); }
        to   { opacity: 0; transform: scale(1.035); }
      }

      /* The artwork's rendered rectangle, reproducing object-fit: cover in CSS.
         The artwork is now drawn at the frame's own 195:422, so at 390x844 this is
         an identity transform — it costs nothing there. It earns its keep on frames
         whose ratio differs: under 480px the frame becomes 100vw x 100dvh, and on a
         320x568 screen (0.563) cover crops ~62px off the top and bottom, taking the
         loading bar with it. Percentages inside here follow the picture, so the bar
         overlay stays on the bar instead of floating ~35px above it. */
      .splash-stage {
        position: absolute;
        left: 50%;
        top: 50%;
        translate: -50% -50%;
        width: max(100cqw, 100cqh * 853 / 1844);
        aspect-ratio: 853 / 1844;
        pointer-events: none;
      }

      /* The loading bar is painted into the artwork, so it cannot be driven
         directly. What runs here is a replica laid exactly over it, filling from
         empty to full while the app boots. It borrows the baked bar's own colours,
         geometry and pill caps, so it reads as that bar filling rather than as a
         second indicator stacked on one that is already part-full.

         Every number below was measured off the asset's pixels, not estimated. In
         the 853x1844 artwork the track spans x 287.8-563.9 and y 1434.0-1450.5 and
         the fill's own edge reaches x 468.1 — 65.302% along, which is the resting
         value used when motion is reduced. Those are 50%-alpha crossings off the
         decoded pixels, not first-touched ones, so the replica lands on the bar's
         true edge rather than half a pixel outside it. Track #C2D1E9, fill #0067FD. As
         percentages of .splash-stage, which is the artwork's own rendered
         rectangle, those hold at every viewport size. */
      .splash-bar {
        position: absolute;
        left: 33.7397%;
        top: 77.7657%;
        width: 32.3681%;
        height: 0.8948%;
        border-radius: 999px;
        background: #C2D1E9;
        overflow: hidden;
      }

      /* Slid in from the left rather than grown. A translate is compositor-only, so
         it cannot stutter against React mounting and auth resolving in the same
         moment, and the fill keeps a true round cap at every position because the
         pill is always full width — only how much of it has cleared the track's
         left edge changes. Growing the width instead would square the cap off at
         low progress and put a layout pass in the middle of startup. */
      .splash-bar-fill {
        position: absolute;
        inset: 0;
        border-radius: 999px;
        background: #0067FD;
        transform: translateX(-100%);
        animation: splash-fill 2100ms cubic-bezier(0.4, 0, 0.2, 1) forwards;
        will-change: transform;
      }

      /* A soft bloom carried on the leading edge, travelling on the same keyframes
         so it cannot drift out of step. It is the only part that bleeds past the
         bar, and it is why the fill itself can stay flat #0067FD: the energy lives
         in the light around the edge rather than in a gradient, which would stop
         the fill matching the colour the artwork already carries. */
      .splash-bar-glow {
        position: absolute;
        left: 33.7397%;
        top: 77.0131%;
        width: 32.3681%;
        height: 2.4%;
        transform: translateX(-100%);
        /* Travels on splash-fill so it cannot drift from the fill, and fades at
           both extremes so the bloom never sits outside the bar: at rest it would
           otherwise tint the artwork just left of the track, and on completion it
           would flare past the right cap. Fading is used rather than clipping
           because a clip would cut a soft glow with a hard vertical edge. */
        animation:
          splash-fill 2100ms cubic-bezier(0.4, 0, 0.2, 1) forwards,
          splash-glow-fade 2100ms linear forwards;
        will-change: transform, opacity;
      }

      @keyframes splash-glow-fade {
        0%   { opacity: 0; }
        12%  { opacity: 1; }
        88%  { opacity: 1; }
        100% { opacity: 0; }
      }

      /* Centred on the leading edge rather than ending at it, so the bloom falls
         evenly either side instead of being cut in half by the element's own edge. */
      .splash-bar-glow::after {
        content: '';
        position: absolute;
        right: 0;
        top: 0;
        height: 100%;
        width: 22%;
        transform: translateX(50%);
        background: radial-gradient(ellipse at center,
          rgba(48, 134, 255, 0.55), rgba(0, 103, 253, 0) 70%);
      }

      @keyframes splash-fill {
        from { transform: translateX(-100%); }
        to   { transform: translateX(0); }
      }

      /* Leaving reads as complete. Tapping through at 40% should not fade out a
         half-finished bar, and nothing should still be moving behind the fade. */
      .splash-shell.is-leaving .splash-bar-fill {
        animation: none;
        transform: translateX(0);
      }

      .splash-shell.is-leaving .splash-bar-glow {
        animation: none;
        transform: translateX(0);
        opacity: 0;
      }

      /* The artwork says "LOADING" in pixels, which a screen reader cannot read. */
      .splash-status {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
        border: 0;
      }


      @media (prefers-reduced-motion: reduce) {
        /* The splash still fades, and over the same 460ms the component waits on
           before navigating — only the scale and the pulse go. */
        .splash-shell.is-leaving {
          animation: splash-out-fade 460ms linear both;
        }
        @keyframes splash-out-fade {
          from { opacity: 1; }
          to   { opacity: 0; }
        }
        /* The fill still runs. A progress bar advancing is informative motion, not
           vestibular motion, and pinning it would park the bar on the 65% the
           artwork already carries — which reads as a load that has stalled, the
           one thing a splash must never look like. Only the travelling bloom goes,
           and the easing flattens to linear so the advance is plain rather than
           choreographed. */
        .splash-bar-fill {
          animation-timing-function: linear;
        }
        .splash-bar-glow { display: none; }
      }
    </style>
  </head>
  <body>
    <div id="tp-boot">
      <div class="tp-boot-frame" aria-hidden="true">
        <img src="/src/assets/traders-planet-splash.webp" width="853" height="1844" alt="" fetchpriority="high" decoding="async" />
        <div class="splash-stage"><div class="splash-bar"><div class="splash-bar-fill"></div></div><div class="splash-bar-glow"></div></div>
      </div>
      <span role="status" class="splash-status">Loading The Traders Planet</span>
    </div>
    <script>
      // Shows the artwork (and starts the bar) only once it can be drawn whole,
      // and records when, so the React splash continues the same timeline.
      (function () {
        var boot = document.getElementById('tp-boot');
        var img = boot && boot.querySelector('img');
        if (!img) return;
        var loaded = img.decode ? img.decode() : new Promise(function (resolve, reject) {
          if (img.complete && img.naturalWidth) resolve(); else { img.onload = resolve; img.onerror = reject; }
        });
        loaded.then(function () {
          window.__tpArtAt = performance.now();
          boot.classList.add('art-ready');
        }, function () { boot.classList.add('art-failed'); });
      })();
    </script>
    <div id="root"></div>
    <!-- Start-up watchdog. A classic script, not a module, so it runs even
         when the app's own code never arrives: a dropped connection while the
         first files load used to leave a blank page, or a dead message with
         no way forward. It shows a clear state with a Try again button,
         retries by itself when the connection returns, and says "taking
         longer than usual" (not "failed") when the start is only slow. The
         app replaces this panel the moment it renders, and sets
         window.__tpBooted so the watchdog stands down. Real errors still go
         to the console. -->
    <script>
      (function () {
        var shown = false;
        function panel(kind) {
          var root = document.getElementById('root');
          if (!root || window.__tpBooted || (shown && kind !== 'failed') || root.childElementCount > 0 && !shown) return;
          shown = true;
          var boot = document.getElementById('tp-boot');
          if (boot) boot.remove();
          var offline = navigator.onLine === false;
          var title = kind === 'slow' ? 'Taking longer than usual' : (offline ? 'You are offline' : 'The app could not load');
          var text = kind === 'slow' ? 'Your connection seems slow. You can keep waiting or try again.'
            : (offline ? 'It will open as soon as your connection is back.' : 'Check your connection and try again.');
          root.innerHTML =
            '<div role="alert" style="min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;' +
            'padding:24px;text-align:center;background:#0C091E;color:#fff;font-family:system-ui,-apple-system,sans-serif;line-height:1.5">' +
            '<div style="font-size:17px;font-weight:700">' + title + '</div>' +
            '<div style="font-size:14px;opacity:.8;max-width:300px">' + text + '</div>' +
            '<button type="button" id="tp-boot-retry" style="margin-top:6px;min-height:44px;padding:10px 24px;border:0;border-radius:12px;' +
            'background:#0B5FEF;color:#fff;font-size:15px;font-weight:700;cursor:pointer">Try again</button></div>';
          var retry = document.getElementById('tp-boot-retry');
          if (retry) retry.onclick = function () { location.reload(); };
          if (kind === 'failed') window.addEventListener('online', function () { location.reload(); }, { once: true });
        }
        window.__tpBootFailed = function (err) {
          if (err) console.error('The app failed to start:', err);
          panel('failed');
        };
        // A start-up file (script or stylesheet) that fails to download.
        window.addEventListener('error', function (e) {
          var t = e && e.target;
          if (!window.__tpBooted && t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK') && /\/assets\//.test(t.src || t.href || '')) {
            window.__tpBootFailed(new Error('Could not load ' + (t.src || t.href)));
          }
        }, true);
        setTimeout(function () { if (!window.__tpBooted) panel('slow'); }, 25000);
      })();
    </script>
    <!-- A dynamic import, not a plain <script src>, so a failure the app
         itself cannot recover from is catchable here and handed to the
         watchdog above. -->
    <script type="module">
      import('/src/main.tsx').catch((err) => {
        if (window.__tpBootFailed) window.__tpBootFailed(err);
        else console.error('The app failed to start:', err);
      });
    </script>
  </body>
</html>
