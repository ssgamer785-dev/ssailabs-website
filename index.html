<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale/user-scalable keep the shell at 1:1 on mobile. iOS Safari
         ignores user-scalable for accessibility, which is why the gesture
         handlers in src/lib/app-zoom.ts exist rather than relying on this. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no"
    />

    <!-- Restores a saved dark theme before the first paint. Without this the
         page paints light from index.css, React mounts, and the theme flips a
         frame later — a white flash on every reload for anyone using dark.
         Inline and synchronous on purpose: a deferred module would be too late.
         The key matches THEME_STORAGE_KEY in src/lib/theme.tsx. -->
    <script>
      try {
        if (localStorage.getItem('tp-theme') === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (e) {}
    </script>

    <!-- Tab and home-screen branding. Nothing was declared here before, so the
         browser fell back to requesting /favicon.ico, which the SPA catch-all
         in server.ts answers with index.html — the tab kept whatever generic
         icon the host had. These icons are cut from the mark in
         src/assets/traders-planet-logo.jpg; the wordmark under it is
         illegible below about 64px, so the tile reuses the mark alone on the
         logo's own background. Files live in public/, so Vite copies them to
         the site root unhashed and /favicon.ico resolves for real. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0C091E" />

    <!-- Poppins is the app's typeface and is self-hosted: the @font-face in
         src/index.css points at src/assets/fonts/Poppins-Regular.ttf, so the
         font ships with the bundle instead of being fetched from a third
         party that a network can block. -->
    <title>The Traders Planet</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Start-up watchdog. A classic script, not a module, so it runs even
         when the app's own code never arrives: a dropped connection while the
         first files load used to leave a blank page, or a dead message with
         no way forward. It shows a clear state with a Try again button,
         retries by itself when the connection returns, and says "taking
         longer than usual" (not "failed") when the start is only slow. The
         app replaces this panel the moment it renders, and sets
         window.__tpBooted so the watchdog stands down. Real errors still go
         to the console. -->
    <script>
      (function () {
        var shown = false;
        function panel(kind) {
          var root = document.getElementById('root');
          if (!root || window.__tpBooted || (shown && kind !== 'failed') || root.childElementCount > 0 && !shown) return;
          shown = true;
          var offline = navigator.onLine === false;
          var title = kind === 'slow' ? 'Taking longer than usual' : (offline ? 'You are offline' : 'The app could not load');
          var text = kind === 'slow' ? 'Your connection seems slow. You can keep waiting or try again.'
            : (offline ? 'It will open as soon as your connection is back.' : 'Check your connection and try again.');
          root.innerHTML =
            '<div role="alert" style="min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;' +
            'padding:24px;text-align:center;background:#0C091E;color:#fff;font-family:system-ui,-apple-system,sans-serif;line-height:1.5">' +
            '<div style="font-size:17px;font-weight:700">' + title + '</div>' +
            '<div style="font-size:14px;opacity:.8;max-width:300px">' + text + '</div>' +
            '<button type="button" id="tp-boot-retry" style="margin-top:6px;min-height:44px;padding:10px 24px;border:0;border-radius:12px;' +
            'background:#0B5FEF;color:#fff;font-size:15px;font-weight:700;cursor:pointer">Try again</button></div>';
          var retry = document.getElementById('tp-boot-retry');
          if (retry) retry.onclick = function () { location.reload(); };
          if (kind === 'failed') window.addEventListener('online', function () { location.reload(); }, { once: true });
        }
        window.__tpBootFailed = function (err) {
          if (err) console.error('The app failed to start:', err);
          panel('failed');
        };
        // A start-up file (script or stylesheet) that fails to download.
        window.addEventListener('error', function (e) {
          var t = e && e.target;
          if (!window.__tpBooted && t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK') && /\/assets\//.test(t.src || t.href || '')) {
            window.__tpBootFailed(new Error('Could not load ' + (t.src || t.href)));
          }
        }, true);
        setTimeout(function () { if (!window.__tpBooted) panel('slow'); }, 25000);
      })();
    </script>
    <!-- A dynamic import, not a plain <script src>, so a failure the app
         itself cannot recover from is catchable here and handed to the
         watchdog above. -->
    <script type="module">
      import('/src/main.tsx').catch((err) => {
        if (window.__tpBootFailed) window.__tpBootFailed(err);
        else console.error('The app failed to start:', err);
      });
    </script>
  </body>
</html>
